<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Sidewalk Planner</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    #conversation { border: 1px solid #ccc; padding: 1rem; min-height: 300px; margin-bottom: 1rem; white-space: pre-wrap; }
    .user { color: #0066cc; margin-bottom: 0.5rem; }
    .assistant { color: #222; margin-bottom: 1rem; }
    #input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
    button { padding: 0.5rem 1rem; margin-top: 0.5rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>
<body>
  <h1>Ask the Assistant</h1>
  <div id="conversation"></div>
  <textarea id="input" rows="3" placeholder="Type your question..."></textarea>
  <button id="send">Send</button>

  <script src="chat.js"></script>
</body>
</html>
